services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Fill MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_ROOT_HOST: "%"
    volumes:
      - employees_mysql:/var/lib/mysql

volumes:
  employees_mysql:
