<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="text-align: center; margin-top: 5vh;">
        <div style="font-size: 40px;">CIFAR-10 图片识别</div>

        <!-- 图片选择 & 上传 -->
        <div style="margin-top: 30px;">
            <input type="file" id="fileInput" accept="image/*" style="font-size: 16px;">
            <button onclick="predictImage()" style="margin-left: 10px; padding: 8px 20px; font-size: 16px; cursor: pointer;">识别</button>
        </div>

        <!-- 图片预览 -->
        <div id="imageContainer" style="margin-top: 20px; min-height: 50px;"></div>

        <!-- 识别结果 -->
        <div id="result" style="margin-top: 20px; font-size: 32px; font-weight: bold; color: #e74c3c;"></div>
    </div>

    <script>
        async function predictImage() {
            const input = document.getElementById('fileInput');
            const file = input.files[0];
            if (!file) {
                alert('请先选择一张图片');
                return;
            }

            // 预览图片
            const reader = new FileReader();
            reader.onload = function(e) {
                const container = document.getElementById('imageContainer');
                container.innerHTML = '<img src="' + e.target.result + '" style="max-width: 280px; max-height: 280px; border: 2px solid #333; border-radius: 8px;">';
            };
            reader.readAsDataURL(file);

            // 上传到 Flask 识别
            const formData = new FormData();
            formData.append('image', file);

            const response = await fetch('/predict', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const result = await response.text();
                document.getElementById('result').innerHTML = '识别结果：<span style="font-size: 48px;">' + result + '</span>';
            } else {
                document.getElementById('result').innerHTML = '识别失败，请重试';
            }
        }
    </script>
</body>
</html>
